<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fuel AI Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg: #f4f6f8;
            --surface: #ffffff;
            --text: #1f2933;
            --muted: #667085;
            --border: #d9e2ec;
            --primary: #0f766e;
            --primary-dark: #115e59;
            --danger: #b91c1c;
            --info: #2563eb;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            background: var(--bg);
            color: var(--text);
            font-family: Arial, sans-serif;
        }

        header {
            background: #102a43;
            color: white;
            padding: 24px 32px;
        }

        header h1 {
            margin: 0 0 6px;
            font-size: 28px;
            letter-spacing: 0;
        }

        header p {
            margin: 0;
            color: #d9e2ec;
        }

        main {
            width: min(1180px, calc(100% - 32px));
            margin: 24px auto 40px;
        }

        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 18px;
            box-shadow: 0 8px 24px rgba(15, 23, 42, 0.06);
        }

        .card h2, .card h3 {
            margin: 0 0 14px;
            font-size: 18px;
        }

        .grid {
            display: grid;
            grid-template-columns: 1.1fr 0.9fr;
            gap: 18px;
            align-items: start;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 14px;
            margin-bottom: 18px;
        }

        .metric {
            min-height: 112px;
        }

        .metric span {
            display: block;
            color: var(--muted);
            font-size: 13px;
            margin-bottom: 10px;
        }

        .metric strong {
            display: block;
            font-size: 28px;
        }

        .flow {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 10px;
            margin-bottom: 16px;
        }

        .step {
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 12px;
            background: #f8fafc;
        }

        .step strong {
            display: block;
            font-size: 14px;
            margin-bottom: 4px;
        }

        .step span {
            color: var(--muted);
            font-size: 13px;
        }

        .step.active {
            border-color: var(--primary);
            background: #ecfdf5;
        }

        .actions {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            align-items: center;
        }

        .hidden { display: none !important; }

        .topbar {
            display: flex;
            justify-content: space-between;
            gap: 14px;
            align-items: center;
        }

        .language-tabs {
            display: inline-flex;
            background: rgba(255, 255, 255, 0.12);
            border: 1px solid rgba(255, 255, 255, 0.24);
            border-radius: 8px;
            padding: 3px;
        }

        .language-tabs button {
            min-height: 32px;
            background: transparent;
            color: white;
            border-radius: 6px;
            padding: 0 10px;
        }

        .language-tabs button.active {
            background: white;
            color: #102a43;
        }

        .login-shell {
            width: min(420px, calc(100% - 32px));
            margin: 70px auto;
        }

        .login-shell .language-tabs {
            background: #102a43;
            margin-bottom: 16px;
        }

        .admin-grid {
            display: grid;
            grid-template-columns: minmax(280px, 0.8fr) 1.2fr;
            gap: 16px;
            align-items: start;
        }

        .filters {
            display: grid;
            grid-template-columns: minmax(160px, 220px) minmax(160px, 1fr) auto auto;
            gap: 10px;
            align-items: end;
            margin-bottom: 14px;
        }

        button {
            min-height: 40px;
            padding: 0 14px;
            border: 0;
            border-radius: 6px;
            background: var(--primary);
            color: white;
            font-weight: 700;
            cursor: pointer;
        }

        button:hover { background: var(--primary-dark); }

        button.secondary {
            background: #e5e7eb;
            color: var(--text);
        }

        button.danger { background: var(--danger); }
        button.danger:hover { background: #991b1b; }

        input, select {
            width: 100%;
            min-height: 40px;
            padding: 8px 10px;
            border: 1px solid var(--border);
            border-radius: 6px;
            background: white;
        }

        input[type="file"] { padding: 8px; }
        input[type="checkbox"] {
            width: auto;
            min-height: auto;
        }

        label {
            display: grid;
            gap: 6px;
            color: var(--muted);
            font-size: 13px;
            font-weight: 700;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 12px;
        }

        .form-grid .wide { grid-column: 1 / -1; }

        .status {
            margin: 14px 0;
            padding: 12px;
            border-radius: 8px;
            background: #eff6ff;
            color: #1e3a8a;
            border: 1px solid #bfdbfe;
            font-size: 14px;
        }

        .status.warning {
            background: #fffbeb;
            border-color: #fde68a;
            color: #b45309;
        }

        .status.success {
            background: #f0fdf4;
            border-color: #bbf7d0;
            color: #15803d;
        }

        .status.error {
            background: #fef2f2;
            border-color: #fecaca;
            color: var(--danger);
        }

        .quality-grid {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 8px;
            margin: 12px 0 0;
        }

        .quality-chip {
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 8px;
            background: #f8fafc;
            font-size: 12px;
        }

        .quality-chip strong {
            display: block;
            color: var(--text);
            margin-bottom: 3px;
        }

        .quality-chip.good {
            border-color: #86efac;
            background: #f0fdf4;
        }

        .quality-chip.warn {
            border-color: #fde68a;
            background: #fffbeb;
        }

        .query-row {
            display: grid;
            grid-template-columns: 1fr auto;
            gap: 10px;
            margin-top: 14px;
        }

        .query-answer {
            margin-top: 10px;
            color: var(--info);
            font-size: 14px;
        }

        .ocr-text {
            max-height: 160px;
            overflow: auto;
            margin: 14px 0 0;
            padding: 12px;
            background: #111827;
            color: #f9fafb;
            border-radius: 8px;
            white-space: pre-wrap;
            font-size: 12px;
        }

        .chart-wrap { height: 320px; }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            padding: 10px 8px;
            border-bottom: 1px solid var(--border);
            text-align: left;
            font-size: 14px;
        }

        th {
            color: var(--muted);
            font-size: 12px;
            text-transform: uppercase;
        }

        td button {
            min-height: 30px;
            padding: 0 10px;
            font-size: 12px;
        }

        .empty {
            color: var(--muted);
            padding: 20px 0 4px;
        }

        @media (max-width: 840px) {
            header { padding: 20px 16px; }
            .grid, .stats-grid, .flow, .form-grid, .filters, .query-row, .quality-grid, .admin-grid {
                grid-template-columns: 1fr;
            }
            .metric { min-height: auto; }
        }
    </style>
</head>

<body>
<section id="loginView" class="login-shell card">
    <div class="language-tabs" data-lang-tabs></div>
    <h2 data-i18n="loginTitle"></h2>
    <p style="color: var(--muted); margin-top: 0;" data-i18n="loginSubtitle"></p>
    <form onsubmit="login(event)">
        <label><span data-i18n="username"></span>
            <input id="loginUsername" autocomplete="username" required>
        </label>
        <label style="margin-top: 12px;"><span data-i18n="password"></span>
            <input id="loginPassword" type="password" autocomplete="current-password" required>
        </label>
        <button style="width: 100%; margin-top: 16px;" type="submit" data-i18n="loginButton"></button>
    </form>
    <div id="loginStatus" class="status" style="margin-bottom: 0;" data-i18n="defaultAdmin"></div>
</section>

<div id="appShell" class="hidden">
<header>
    <div class="topbar">
        <div>
            <h1 data-i18n="appTitle"></h1>
            <p data-i18n="appSubtitle"></p>
        </div>
        <div class="actions">
            <div class="language-tabs" data-lang-tabs></div>
            <span id="currentUserLabel"></span>
            <button class="secondary" onclick="logout()" data-i18n="logout"></button>
        </div>
    </div>
</header>

<main>
    <section id="adminPanel" class="card hidden" style="margin-bottom: 18px;">
        <h2 data-i18n="accountManagement"></h2>
        <div class="admin-grid">
            <form onsubmit="createUser(event)">
                <h3 data-i18n="createUser"></h3>
                <label><span data-i18n="username"></span>
                    <input id="newUsername" required>
                </label>
                <label style="margin-top: 10px;"><span data-i18n="password"></span>
                    <input id="newPassword" type="password" required minlength="6">
                </label>
                <label style="margin-top: 10px;">
                    <span><input id="newIsAdmin" type="checkbox"> <span data-i18n="administrator"></span></span>
                </label>
                <button style="margin-top: 12px;" type="submit" data-i18n="createAccount"></button>
                <div id="adminStatus" class="status" style="margin-bottom: 0;" data-i18n="adminHelp"></div>
            </form>
            <div>
                <h3 data-i18n="users"></h3>
                <div id="usersTable"></div>
            </div>
        </div>
    </section>

    <section class="stats-grid">
        <div class="card metric">
            <span data-i18n="totalFuelCost"></span>
            <strong id="total">0.00 EUR</strong>
        </div>
        <div class="card metric">
            <span data-i18n="savedRecords"></span>
            <strong id="recordCount">0</strong>
        </div>
        <div class="card metric">
            <span data-i18n="latestMonth"></span>
            <strong id="latestMonth"></strong>
        </div>
    </section>

    <section class="grid">
        <div class="card">
            <h2 data-i18n="receiptWorkflow"></h2>
            <div class="flow">
                <div class="step active" id="stepUpload">
                    <strong data-i18n="stepUpload"></strong>
                    <span data-i18n="stepUploadText"></span>
                </div>
                <div class="step" id="stepReview">
                    <strong data-i18n="stepReview"></strong>
                    <span data-i18n="stepReviewText"></span>
                </div>
                <div class="step" id="stepSave">
                    <strong data-i18n="stepSave"></strong>
                    <span data-i18n="stepSaveText"></span>
                </div>
            </div>

            <div class="actions">
                <input type="file" id="fileInput" accept="image/*">
                <button id="uploadButton" onclick="uploadReceipt()" data-i18n="uploadRecognize"></button>
                <button class="secondary" onclick="startManualEntry()" data-i18n="manualEntry"></button>
            </div>

            <div id="status" class="status"></div>
            <div id="qualityPanel" class="quality-grid" hidden></div>
            <pre id="ocrText" class="ocr-text" hidden></pre>

            <form id="recordForm" onsubmit="saveRecord(event)">
                <h3 data-i18n="receiptDetails"></h3>
                <input id="recordId" name="recordId" type="hidden">
                <div class="form-grid">
                    <label><span data-i18n="station"></span>
                        <input id="station" name="station" placeholder="Shell, Aral, Esso">
                    </label>
                    <label><span data-i18n="fuelType"></span>
                        <input id="fuel_type" name="fuel_type" placeholder="Diesel, Super E10">
                    </label>
                    <label><span data-i18n="date"></span>
                        <input id="date" name="date" type="date" required>
                    </label>
                    <label><span data-i18n="time"></span>
                        <input id="time" name="time" type="time">
                    </label>
                    <label><span data-i18n="amount"></span>
                        <input id="amount" name="amount" type="number" step="0.01" min="0" required>
                    </label>
                    <label><span data-i18n="postcode"></span>
                        <input id="postcode" name="postcode" inputmode="numeric" placeholder="10115">
                    </label>
                    <label class="wide"><span data-i18n="street"></span>
                        <input id="street" name="street" data-placeholder="streetPlaceholder">
                    </label>
                    <label><span data-i18n="city"></span>
                        <input id="city" name="city" placeholder="Berlin">
                    </label>
                </div>
                <div class="actions" style="margin-top: 14px;">
                    <button id="saveButton" type="submit"></button>
                    <button id="duplicateButton" type="button" class="secondary" onclick="saveDuplicate()" hidden data-i18n="saveAnyway"></button>
                    <button type="button" class="secondary" onclick="clearForm()" data-i18n="clear"></button>
                </div>
            </form>
        </div>

        <div class="card">
            <h2 data-i18n="monthlyFuelCost"></h2>
            <div class="query-row">
                <input id="questionInput" data-placeholder="questionPlaceholder">
                <button onclick="askQuestion()" data-i18n="ask"></button>
            </div>
            <div id="queryAnswer" class="query-answer"></div>
            <div class="chart-wrap">
                <canvas id="monthlyChart"></canvas>
            </div>
        </div>
    </section>

    <section class="card" style="margin-top: 18px;">
        <h2 data-i18n="recentRecords"></h2>
        <div class="filters">
            <label id="adminUserFilter" class="hidden"><span data-i18n="user"></span>
                <select id="filterUser" onchange="applyFilters()"></select>
            </label>
            <label><span data-i18n="month"></span>
                <input id="filterMonth" type="month">
            </label>
            <label><span data-i18n="station"></span>
                <input id="filterStation" placeholder="Shell, Aral, Esso">
            </label>
            <button onclick="applyFilters()" data-i18n="apply"></button>
            <button class="secondary" onclick="resetFilters()" data-i18n="reset"></button>
        </div>
        <div id="records"></div>
    </section>
</main>
</div>

function tr(key, params = {}) {
    let value = i18n[currentLang][key] || i18n.en[key] || key;
    Object.entries(params).forEach(([name, replacement]) => {
        value = value.replaceAll(`{${name}}`, replacement);
    });
    return value;
}

function setLanguage(lang) {
    currentLang = lang;
    localStorage.setItem("fuel_lang", lang);
    document.documentElement.lang = lang;
    renderLanguageTabs();
    applyTranslations();
    renderUsers();
    renderUserFilter();
    renderQuality(lastQualityScores);
    renderRecords();
    updateSaveButton();
    updateLatestMonthLabel();
    updateChartLabel();
    if (!document.getElementById("status").textContent) {
        setStatus(tr("uploadOrManual"));
    }
}

function renderLanguageTabs() {
    document.querySelectorAll("[data-lang-tabs]").forEach(container => {
        container.innerHTML = ["de", "zh", "en"].map(lang => `
            <button type="button" class="${lang === currentLang ? "active" : ""}" onclick="setLanguage('${lang}')">${i18n[lang].langName}</button>
        `).join("");
    });
}

function applyTranslations() {
    document.querySelectorAll("[data-i18n]").forEach(node => {
        node.textContent = tr(node.dataset.i18n);
    });
    document.querySelectorAll("[data-placeholder]").forEach(node => {
        node.placeholder = tr(node.dataset.placeholder);
    });
    document.getElementById("latestMonth").textContent ||= tr("noData");
}

async function apiFetch(url, options = {}) {
    const res = await fetch(url, options);
    if (res.status === 401) {
        showLogin();
        throw new Error("Login required");
    }
    return res;
}

function showLogin() {
    currentUser = null;
    document.getElementById("loginView").classList.remove("hidden");
    document.getElementById("appShell").classList.add("hidden");
}

function showApp(user) {
    currentUser = user;
    document.getElementById("loginView").classList.add("hidden");
    document.getElementById("appShell").classList.remove("hidden");
    document.getElementById("currentUserLabel").textContent = `${user.username}${user.is_admin ? ` (${tr("adminRole")})` : ""}`;
    document.getElementById("adminPanel").classList.toggle("hidden", !user.is_admin);
    document.getElementById("adminUserFilter").classList.toggle("hidden", !user.is_admin);
}

async function checkAuth() {
    renderLanguageTabs();
    applyTranslations();
    setStatus(tr("uploadOrManual"));
    const res = await fetch("/auth/status");
    const data = await res.json();
    if (!data.user) {
        showLogin();
        return;
    }
    showApp(data.user);
    if (data.user.is_admin) {
        await loadUsers();
    }
    await loadAll();
}

async function login(event) {
    event.preventDefault();
    const status = document.getElementById("loginStatus");
    status.className = "status";
    status.textContent = tr("loggingIn");

    const res = await fetch("/auth/login", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({
            username: document.getElementById("loginUsername").value.trim(),
            password: document.getElementById("loginPassword").value
        })
    });
    const data = await res.json();
    if (!res.ok) {
        status.className = "status error";
        status.textContent = tr("loginFailed");
        return;
    }

    document.getElementById("loginPassword").value = "";
    showApp(data.user);
    if (data.user.is_admin) {
        await loadUsers();
    }
    await loadAll();
}

async function logout() {
    await fetch("/auth/logout", {method: "POST"});
    showLogin();
}

async function loadUsers() {
    if (!currentUser?.is_admin) return;
    const res = await apiFetch("/admin/users");
    users = await res.json();
    renderUsers();
    renderUserFilter();
}

function renderUserFilter() {
    const select = document.getElementById("filterUser");
    if (!select || !currentUser?.is_admin) return;
    const previous = select.value;
    select.innerHTML = users.map(user => `
        <option value="${user.id}">${escapeHtml(user.username)}${user.is_admin ? ` (${tr("adminRole")})` : ""}${user.is_active ? "" : ` ${tr("inactive")}`}</option>
    `).join("");
    select.value = previous && users.some(user => String(user.id) === previous)
        ? previous
        : String(currentUser.id);
}

function renderUsers() {
    const table = document.getElementById("usersTable");
    if (!table || !currentUser?.is_admin) return;
    if (!users.length) {
        table.innerHTML = `<div class="empty">${tr("noUsers")}</div>`;
        return;
    }

    const rows = users.map(user => `
        <tr>
            <td>${escapeHtml(user.username)}</td>
            <td>${user.is_admin ? tr("adminRole") : tr("normalUser")}</td>
            <td>${user.is_active ? tr("active") : tr("inactive")}</td>
            <td>
                <div class="actions">
                    <button class="secondary" onclick="resetPassword(${user.id})">${tr("resetPassword")}</button>
                    <button class="secondary" onclick="toggleAdmin(${user.id}, ${user.is_admin ? "false" : "true"})">${user.is_admin ? tr("removeAdmin") : tr("makeAdmin")}</button>
                    <button class="${user.is_active ? "danger" : "secondary"}" onclick="toggleActive(${user.id}, ${user.is_active ? "false" : "true"})">${user.is_active ? tr("deactivate") : tr("activate")}</button>
                </div>
            </td>
        </tr>
    `).join("");

    table.innerHTML = `
        <table>
            <thead>
                <tr>
                    <th>${tr("username")}</th>
                    <th>${tr("role")}</th>
                    <th>${tr("status")}</th>
                    <th></th>
                </tr>
            </thead>
            <tbody>${rows}</tbody>
        </table>
    `;
}

async function createUser(event) {
    event.preventDefault();
    const payload = {
        username: document.getElementById("newUsername").value.trim(),
        password: document.getElementById("newPassword").value,
        is_admin: document.getElementById("newIsAdmin").checked
    };
    const res = await apiFetch("/admin/users", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify(payload)
    });
    const status = document.getElementById("adminStatus");
    if (!res.ok) {
        status.className = "status error";
        status.textContent = tr("userCreateFailed");
        return;
    }

    document.getElementById("newUsername").value = "";
    document.getElementById("newPassword").value = "";
    document.getElementById("newIsAdmin").checked = false;
    status.className = "status success";
    status.textContent = tr("userCreated");
    await loadUsers();
}

async function updateUserAccount(userId, payload) {
    const res = await apiFetch(`/admin/users/${userId}`, {
        method: "PUT",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify(payload)
    });
    const status = document.getElementById("adminStatus");
    if (!res.ok) {
        status.className = "status error";
        status.textContent = tr("userUpdateFailed");
        return;

    if (!password) return;
    await updateUserAccount(userId, {password});
}

async function toggleAdmin(userId, isAdmin) {

}

async function toggleActive(userId, isActive) {

}

function setStatus(message, type = "") {
    const status = document.getElementById("status");
    status.className = `status ${type}`.trim();
    status.textContent = message;
}

function setStep(activeStep) {
    ["stepUpload", "stepReview", "stepSave"].forEach(id => {
        document.getElementById(id).classList.toggle("active", id === activeStep);
    });
}

function updateSaveButton() {
    const button = document.getElementById("saveButton");
    if (!button) return;
    button.textContent = document.getElementById("recordId").value ? tr("updateRecord") : tr("saveRecord");
}

function fillForm(data = {}) {
    document.getElementById("recordId").value = data.id ?? "";
    fields.forEach(field => {
        document.getElementById(field).value = data[field] ?? "";
    });
    updateSaveButton();
    allowDuplicateNextSave = false;
    document.getElementById("duplicateButton").hidden = true;
}

function getFormData() {
    return fields.reduce((payload, field) => {
        payload[field] = document.getElementById(field).value.trim();
        return payload;
    }, {});
}

function clearForm() {
    fillForm();
    document.getElementById("ocrText").hidden = true;
    document.getElementById("ocrText").textContent = "";
    document.getElementById("qualityPanel").hidden = true;
    document.getElementById("qualityPanel").innerHTML = "";
    setStep("stepUpload");
    setStatus(tr("uploadOrManual"));
}

function startManualEntry() {
    clearForm();
    setStep("stepReview");
    setStatus(tr("manualReady"), "warning");
}

async function uploadReceipt() {
    const file = document.getElementById("fileInput").files[0];
    if (!file) {
        setStatus(tr("chooseFile"), "error");
        return;
    }

    const formData = new FormData();
    formData.append("file", file);

    setStep("stepUpload");
    setStatus(tr("ocrRunning"));

    const res = await apiFetch("/upload", {
        method: "POST",
        body: formData
    });

    const result = await res.json();
    if (!res.ok) {
        setStatus(tr("uploadFailed"), "error");
        return;
    }

    fillForm(result.data);
    setStep("stepReview");

    const ocrText = document.getElementById("ocrText");
    ocrText.textContent = result.ocr_text || tr("noOcrText");
    ocrText.hidden = false;

    const quality = result.quality || {};
    renderQuality(quality.field_scores || {});
    const percent = Math.round((quality.confidence || 0) * 100);
    if (quality.needs_review) {
        const missing = (quality.missing_fields || []).join(", ") || tr("unknownFields");
        setStatus(tr("ocrReview", {percent, missing}), "warning");
    } else {
        setStatus(tr("ocrGood", {percent}), "success");
    }
}

let lastQualityScores = {};
function renderQuality(scores = lastQualityScores) {
    lastQualityScores = scores || {};
    const panel = document.getElementById("qualityPanel");
    if (!panel || panel.hidden && !Object.keys(lastQualityScores).length) return;
    const labels = {
        station: tr("qualityStation"),
        date: tr("qualityDate"),
        time: tr("qualityTime"),
        fuel_type: tr("qualityFuel"),
        amount: tr("qualityAmount"),
        city: tr("qualityCity")
    };

    panel.innerHTML = Object.entries(labels).map(([field, label]) => {
        const score = Math.round(Number(lastQualityScores[field] || 0) * 100);
        const tone = score >= 70 ? "good" : "warn";
        return `<div class="quality-chip ${tone}"><strong>${label}</strong>${score}% ${tr("confidence")}</div>`;
    }).join("");
}

async function saveRecord(event) {
    event.preventDefault();
    await submitRecord(false);
}

async function saveDuplicate() {
    await submitRecord(true);
}

async function submitRecord(allowDuplicate) {
    setStep("stepSave");
    setStatus(tr("saving"));

    const recordId = document.getElementById("recordId").value;
    const payload = getFormData();
    payload.allow_duplicate = allowDuplicate || allowDuplicateNextSave;
    if (currentUser?.is_admin) {
        payload.user_id = document.getElementById("filterUser").value;
    }

    const res = await apiFetch(recordId ? `/records/${recordId}` : "/save", {
        method: recordId ? "PUT" : "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify(payload)
    });

    const result = await res.json();
    if (res.status === 409 && result.duplicate) {
        allowDuplicateNextSave = true;
        document.getElementById("duplicateButton").hidden = false;
        const duplicateText = (result.duplicates || [])
            .map(item => `${item.date} ${item.station || tr("unknown")} ${Number(item.amount || 0).toFixed(2)} EUR`)
            .join("; ");
        setStep("stepReview");
        setStatus(tr("duplicateFound", {duplicate: duplicateText}), "warning");
        return;
    }

    if (!res.ok) {
        const errors = result.errors ? Object.values(result.errors).join(" ") : tr("saveFailed");
        setStep("stepReview");
        setStatus(errors, "error");
        return;
    }

    setStatus(tr("saved"), "success");
    fillForm();
    document.getElementById("ocrText").hidden = true;
    document.getElementById("ocrText").textContent = "";
    document.getElementById("qualityPanel").hidden = true;
    document.getElementById("qualityPanel").innerHTML = "";
    lastQualityScores = {};
    await loadAll();
}

    const res = await apiFetch(`/total${filterQuery()}`);
    const data = await res.json();
    document.getElementById("total").textContent = `${Number(data.total || 0).toFixed(2)} EUR`;
}

let latestMonthValue = null;
let latestMonthAmount = null;
function updateLatestMonthLabel() {
    document.getElementById("latestMonth").textContent = latestMonthValue
        ? `${latestMonthValue}: ${Number(latestMonthAmount || 0).toFixed(2)} EUR`
        : tr("noData");
}

function updateChartLabel() {
    if (monthlyChart) {
        monthlyChart.data.datasets[0].label = tr("monthlyFuelCost");
        monthlyChart.update();
    }
}

async function loadMonthly() {
    const params = new URLSearchParams();
    const station = document.getElementById("filterStation")?.value.trim();
    if (station) params.set("station", station);
    if (currentUser?.is_admin) params.set("user_id", document.getElementById("filterUser").value);

    const res = await apiFetch(`/monthly${params.toString() ? `?${params.toString()}` : ""}`);
    const data = await res.json();
    const labels = data.map(item => item.month);
    const values = data.map(item => Number(item.total || 0));

    latestMonthValue = labels.length ? labels[labels.length - 1] : null;
    latestMonthAmount = values.length ? values[values.length - 1] : null;
    updateLatestMonthLabel();

    if (monthlyChart) monthlyChart.destroy();
    monthlyChart = new Chart(document.getElementById("monthlyChart"), {
        type: "bar",
        data: {
            labels,
            datasets: [{
                label: tr("monthlyFuelCost"),
                data: values,
                backgroundColor: "#0f766e",
                borderColor: "#115e59",
                borderWidth: 1
            }]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            scales: { y: { beginAtZero: true } },
            plugins: { legend: { display: false } }
        }
    });
}

function renderRecords() {
    const records = document.getElementById("records");
    if (!records) return;
    if (!loadedRecords.length) {
        records.innerHTML = `<div class="empty">${tr("noRecords")}</div>`;
        return;
    }

    const rows = loadedRecords.slice(0, 8).map(record => `
        <tr>
            <td>${escapeHtml(record.date || "")}</td>
            <td>${escapeHtml(record.station || tr("unknown"))}</td>
            <td>${escapeHtml(record.fuel_type || "")}</td>
            <td>${Number(record.amount || 0).toFixed(2)} EUR</td>
            <td>${escapeHtml([record.postcode, record.city].filter(Boolean).join(" "))}</td>
            <td>
                <div class="actions">
                    <button class="secondary" onclick="editRecord(${record.id})">${tr("edit")}</button>
                    <button class="danger" onclick="deleteRecord(${record.id})">${tr("delete")}</button>
                </div>
            </td>
        </tr>
    `).join("");

    records.innerHTML = `
        <table>
            <thead>
                <tr>
                    <th>${tr("tableDate")}</th>
                    <th>${tr("tableStation")}</th>
                    <th>${tr("tableFuel")}</th>
                    <th>${tr("tableAmount")}</th>
                    <th>${tr("tableLocation")}</th>
                    <th></th>
                </tr>
            </thead>
            <tbody>${rows}</tbody>
        </table>
    `;
}

async function loadRecords() {
    const res = await apiFetch(`/records${filterQuery()}`);
    loadedRecords = await res.json();
    document.getElementById("recordCount").textContent = loadedRecords.length;
    renderRecords();
}

function editRecord(id) {
    const record = loadedRecords.find(item => item.id === id);
    if (!record) {
        setStatus(tr("recordNotInTable"), "error");
        return;
    }

    fillForm(record);
    setStep("stepReview");
    setStatus(tr("editing"), "warning");
    window.scrollTo({top: 0, behavior: "smooth"});
}

async function deleteRecord(id) {
    const record = loadedRecords.find(item => item.id === id);
    const label = record
        ? `${record.date || tr("noDate")} ${record.station || tr("unknown")} ${Number(record.amount || 0).toFixed(2)} EUR`
        : `${tr("record")} #${id}`;

    if (!window.confirm(tr("confirmDelete", {label}))) return;

    const res = await apiFetch(`/records/${id}${currentUser?.is_admin ? `?user_id=${encodeURIComponent(document.getElementById("filterUser").value)}` : ""}`, {
        method: "DELETE"
    });

    const result = await res.json();
    if (!res.ok) {
        setStatus(result.error || tr("deleteFailed"), "error");
        return;
    }

    if (document.getElementById("recordId").value === String(id)) clearForm();
    setStatus(tr("deleted"), "success");
    await loadAll();
}

function filterQuery() {
    const params = new URLSearchParams();
    const month = document.getElementById("filterMonth")?.value.trim();
    const station = document.getElementById("filterStation")?.value.trim();
    const userId = document.getElementById("filterUser")?.value;
    if (currentUser?.is_admin && userId) params.set("user_id", userId);
    if (month) params.set("month", month);
    if (station) params.set("station", station);
    const query = params.toString();
    return query ? `?${query}` : "";
}

async function applyFilters() {
    await loadAll();
}

async function resetFilters() {
    document.getElementById("filterMonth").value = "";
    document.getElementById("filterStation").value = "";
    await loadAll();
}

async function askQuestion() {
    const input = document.getElementById("questionInput");
    const answer = document.getElementById("queryAnswer");
    const question = input.value.trim();
    if (!question) {
        answer.textContent = tr("typeQuestion");
        return;
    }

    answer.textContent = tr("querying");
    const payload = {question};
    if (currentUser?.is_admin) payload.user_id = document.getElementById("filterUser").value;

    const res = await apiFetch("/ask", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify(payload)
    });
    const result = await res.json();
    if (result.intent === "total") {
        answer.textContent = tr("totalAnswer", {total: Number(result.data?.total || 0).toFixed(2)});
    } else if (result.intent === "records") {
        answer.textContent = tr("recordsAnswer", {count: Array.isArray(result.data) ? result.data.length : 0});
    } else if (result.intent === "monthly") {
        answer.textContent = tr("monthlyAnswer");
    } else {
        answer.textContent = tr("noAnswer");
    }
}

function escapeHtml(value) {
    return String(value).replace(/[&<>"']/g, char => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#039;"
    }[char]));
}

async function loadAll() {
    await Promise.all([loadTotal(), loadMonthly(), loadRecords()]);
}

checkAuth();
