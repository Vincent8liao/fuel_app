<!DOCTYPE html>
<html>
<head>
    <title>Fuel AI Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body {
            font-family: Arial;
            margin: 40px;
            background: #f5f5f5;
        }
        h1 {
            color: #333;
        }
        .card {
            background: white;
            padding: 20px;
            margin-bottom: 20px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        button {
            padding: 10px 15px;
            background: #007BFF;
            color: white;
            border: none;
            border-radius: 5px;
        }
    </style>
</head>

<body>

<h1>🚗 Fuel AI Dashboard</h1>

<!-- 上传 -->
<div class="card">
    <h3>Upload Receipt</h3>
    <input type="file" id="fileInput">
    <button onclick="upload()">Upload</button>
    <pre id="uploadResult"></pre>
</div>

<!-- 总油费 -->
<div class="card">
    <h3>Total Fuel Cost</h3>
    <h2 id="total">Loading...</h2>
</div>

<!-- 每月图 -->
<div class="card">
    <h3>Monthly Cost</h3>
    <canvas id="chart"></canvas>
</div>

<!-- 记录 -->
<div class="card">
    <h3>Recent Records</h3>
    <ul id="records"></ul>
</div>

<script>
async function loadTotal() {
    const res = await fetch("/total");
    const data = await res.json();
    document.getElementById("total").innerText = data.total + " EUR";
}

async function loadMonthly() {
    const res = await fetch("/monthly");
    const data = await res.json();

    const labels = data.map(x => x.month);
    const values = data.map(x => x.total);

    new Chart(document.getElementById("chart"), {
        type: "line",
        data: {
            labels: labels,
            datasets: [{
                label: "Fuel Cost",
                data: values
            }]
        }
    });
}

async function loadRecords() {
    const res = await fetch("/records");
    const data = await res.json();

    const list = document.getElementById("records");
    list.innerHTML = "";

    data.slice(0, 5).forEach(r => {
        const li = document.createElement("li");
        li.innerText = `${r.date} - ${r.station} - ${r.amount} EUR`;
        list.appendChild(li);
    });
}

async function upload() {
    const file = document.getElementById("fileInput").files[0];
    const formData = new FormData();
    formData.append("file", file);

    const res = await fetch("/upload", {
        method: "POST",
        body: formData
    });

    const data = await res.json();
    document.getElementById("uploadResult").innerText = JSON.stringify(data, null, 2);

    loadAll();
}

function loadAll() {
    loadTotal();
    loadMonthly();
    loadRecords();
}

loadAll();
</script>

</body>
</html>
